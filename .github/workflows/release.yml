# A version tag vX.Y.Z publishes that version:
#   1. the image ghcr.io/dooziedan/releasomat:X.Y.Z and :latest, for amd64 and arm64 (Unraid
#      installs :latest);
#   2. the GitHub Release page "Releasomat X.Y.Z", with the version's CHANGELOG.md section as its
#      notes (scripts/release_notes.py).
# Run by hand (Actions tab) with an existing tag, it only creates or refreshes the Release page.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag, e.g. v0.1.0"
        required: true

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Fails early when the changelog has no section for this version.
      - run: python3 scripts/release_notes.py "$TAG" > /dev/null
        env:
          TAG: ${{ github.ref_name }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/releasomat
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-page:
    needs: image
    # After the image is published; by hand (workflow_dispatch) without building it again.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "$TAG" > notes.md
      - name: Create or update the Release
        run: |
          # Only the highest version is marked "Latest", also when an older tag is run by hand.
          newest=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          latest=$([ "$TAG" = "$newest" ] && echo true || echo false)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Releasomat ${TAG#v}" --notes-file notes.md --latest="$latest"
          else
            gh release create "$TAG" --verify-tag --title "Releasomat ${TAG#v}" --notes-file notes.md --latest="$latest"
          fi
