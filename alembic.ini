# Alembic config for the command line (creating new migrations during development):
#   CONFIG_DIR=dev/config .venv/bin/alembic revision --autogenerate -m "…"
# At runtime the app runs migrations itself, see app/db.py.
# The database location comes from CONFIG_DIR (see app/migrations/env.py).
[alembic]
script_location = app/migrations
file_template = %%(rev)s_%%(slug)s
